name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run test suite
        run: python -m pytest tests/ -v

      - name: Smoke test - scripts start without third-party deps
        run: |
          python scripts/scan.py --help
          python scripts/prepare.py --help
          python scripts/verify.py --help

  lint:
    name: syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Byte-compile all scripts
        run: python -m compileall -q scripts/ tests/ && echo "compile ok"

      - name: Verify stdlib-only constraint
        run: |
          # 三个脚本 + 适配层必须只依赖标准库，出现第三方 import 直接失败
          if grep -rnE "^(import|from) (requests|yaml|rich|click|tqdm|numpy|pandas)" scripts/; then
            echo "::error::发现第三方依赖，本项目必须保持仅标准库"
            exit 1
          fi
          echo "stdlib-only check passed"
